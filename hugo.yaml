  # About
  about:
    enable: true
    title: "Sobre Mí"
    image: "/images/Perfil.png"
    content: |-
      Mi primera profesión es la pedagogía, el 2009 encaminé mis pasos hacia la abogacía y desde el 2015 me he dedicado a ejercer como abogada, una de las mayores cualidades que me dio la pedagogía es poder explicar el derecho de una manera simple y así permitir a las personas entender cuáles son los riesgos y opciones que tienen.

      Tengo 10 años de experiencia, orientando, asesorando y apoyando a las personas en sus consultas y necesidades legales.

      La principal área en la que he trabajado es en derecho societario, constituyendo, modificando, transformando empresas, y lo más importante apoyando en sus consultas a los clientes que necesitaban esta asesoría legal.

      Trabajar en el derecho societario me ha llevado a conocer el derecho laboral, para asesorar tanto a empleadores como trabajadores.

      Como me relaciono tanto con empleadores como con trabajadores, surgen las dudas en el área de la seguridad laboral.

      En mí encontrarán una profesional que escucha, comprende, explica y busca con usted la mejor solución a su inquietud para tener información fundamentada del paso que quiere dar.
      
    skills:
      enable: true
      title: "Estas son las áreas en las que hago asesorías:"
      items:
        - "Área Comercial"
        - "Área Laboral"
        - "Área Familia"
        - "Área Civil"

  # Experience
  experience:
    enable: true
    # title: "Custom Name"
    items:
         - company: "Área Comercial"
           jobs:
              - content: "Asesoría a empresas y personas naturales que quieran constituir, modificar, transforma o disolver una sociedad."
         - company: "Área Laboral"
           jobs:
              - content: "Asesoría y orientación a empresas y personas naturales que requieran confeccionar contratos de trabajo, finiquitos, revisar término de relación laboral, liquidación de sueldos, en general, todo sobre leyes sociales y normativa laboral."
         - company: "Área Familia"
           jobs:
              - content: "Asesoría y orientación en temas de familia, tales como, pensión de alimentos, cuidado personal, relación directa y regular (visitas), divorcio, renuncia a los gananciales, división de los bienes después del divorcio."
         - company: "Área Civil"
           jobs:
              - name: "Pensiones, Testamentos y Herencias:"
                content: "Asesoría, orientación y tramitación de pensiones efectivas, testamentos, herencias, sucesiones."
              - name: "Inmuebles:"
                content: "Asesoría, orientación para compraventa de propiedades, estudio de títulos."
              - name: "Escrituras:"
                content: "Escrituras de compraventa de inmuebles, contratos de arrendamiento."

